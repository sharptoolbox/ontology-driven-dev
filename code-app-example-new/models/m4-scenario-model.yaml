model_type: SCENARIO
version: "4.0"
domain: 通用业务
event_scenarios:
  - id: SCN-001
    name: 销售合同签订、审批、开票、收款与自动关闭全流程
    description: 本场景覆盖销售合同从起草到关闭的完整业务路径：销售人员或财务人员录入合同基本信息与付款条款并保存为草稿；创建人提交审批后，系统按合同总金额分级流转至财务经理、必要时追加总经理审批；审批通过后合同生效并可开票，驳回则退回草稿供修改后重提；财务人员按已生效合同的未开票付款阶段登记开票，阶段随即锁定；财务人员按开票登记收款，可多次收款并控制累计收款不超过开票金额；系统在合同全部开票金额收齐后自动关闭合同；各角色按数据权限查询合同、开票、收款及部门统计报表。审批节点细节由 M6 审批流表达，本场景仅描述其业务结果。
    steps:
      - stepId: STEP-001
        name: 合同起草与付款条款维护
        description: 起点由销售人员或财务人员新增合同，录入合同名称、所属产品、所属客户、责任人及所属部门、合同类型、签订时间、合同总金额、对外采购金额、税率等信息，并在同一合同单据中维护付款条款。系统按行顺序生成阶段编号，按合同总金额乘付款比例自动计算该比例金额，并实时校验付款条款至少一条且比例合计等于100%。校验通过后保存合同及全部付款条款，合同状态为草稿，付款阶段开票状态为未开票。草稿合同允许创建人修改、删除或继续提交审批，对应功能 FUN-001、FUN-002、FUN-003，相关规则 RULE-001、RULE-002、RULE-008。
      - stepId: STEP-002
        name: 提交合同审批
        description: 创建人对草稿合同执行提交审批。系统校验必填字段齐全、付款条款至少一条且比例合计为100%，校验通过后合同状态由草稿变为审批中并生成审批待办。审批中的合同不可修改、不可删除、不可开票；创建人可在审批人尚未处理时执行撤回，撤回后合同退回草稿并保留审批记录，对应功能 FUN-004、FUN-005，相关规则 RULE-001、RULE-008。
      - stepId: STEP-003
        name: 按合同金额分级审批并形成生效或驳回结果
        description: 审批阶段由财务经理对全部合同进行审批；合同总金额大于等于100万元时，财务经理通过后继续流转至总经理审批，小于100万元时财务经理通过即结束。任一审批环节驳回时合同退回草稿并保留驳回意见，创建人可修改后重新提交并重新走完整审批路径。最终审批通过后合同状态变为已生效，系统写入合同生效时间，合同可用于后续开票。审批节点、顺序与分支细节见 M6 的 APR-001，本步骤仅描述审批业务结果，对应功能 FUN-006，相关规则 RULE-008。
      - stepId: STEP-004
        name: 按付款阶段登记开票并锁定阶段
        description: 财务人员对状态为已生效且存在未开票付款阶段的合同登记开票。选择合同及未开票付款阶段后，系统带出该阶段金额作为开票金额且不可修改，开票税率默认取合同税率并允许在合法范围内调整，开票时间不得早于合同生效日期且不得晚于当前日期。保存时校验该付款阶段尚未开票，成功后生成开票记录，付款阶段开票状态置为已开票并回填关联开票编号，开票收款状态为未收款，合同累计开票金额同步更新。条件分支为：合同非已生效或阶段已开票时不允许开票；无未开票阶段时不能继续开票。对应功能 FUN-009，相关规则 RULE-003、RULE-004、RULE-008。
      - stepId: STEP-005
        name: 按开票登记收款并更新开票收款状态
        description: 财务人员选择已生效或已关闭合同下收款状态为未收款或部分收款的开票登记收款，一笔开票允许分多次收款。系统校验本次收款金额大于零且不大于该开票未收款金额，收款时间不早于开票时间且不晚于当前日期。保存成功后生成收款记录，更新该开票的累计已收款金额、未收款金额、最后收款时间，并按累计收款与开票金额的比较自动更新收款状态：累计为零为未收款，累计大于零且小于开票金额为部分收款，累计等于开票金额为已收款；同时更新合同累计收款金额。对应功能 FUN-011，相关规则 RULE-005、RULE-006、RULE-008。
      - stepId: STEP-006
        name: 系统判断全部款项收齐并自动关闭合同
        description: 每笔收款保存并更新开票收款状态后，系统自动判断该合同下是否已全部开票且全部开票的收款状态均为已收款。满足条件时，合同状态由已生效自动变为已关闭并写入关闭时间，无需人工关闭；不满足条件时合同保持已生效并允许继续对未收款或部分收款开票登记收款。对于已关闭合同，仍可查看并继续收取尚未收齐的款项，但不可再开票。对应功能 FUN-011，相关规则 RULE-007、RULE-006。
      - stepId: STEP-007
        name: 合同查询、详情查看与部门统计报表输出
        description: 流程末端由各角色按数据权限查询合同台账、开票信息和收款信息，查看合同详情及其付款条款、开票记录、收款记录和审批记录，并按部门与统计时间段查询合同签订总金额、开票总金额和已开票未收款金额，必要时导出统计报表。普通员工和销售人员仅能查看和统计本人所属部门数据，财务人员、财务经理、总经理可查看全部部门数据。该步骤作为全流程业务结果输出，不改变合同、开票和收款数据。对应功能 FUN-007、FUN-008、FUN-010、FUN-012、FUN-013、FUN-014，相关规则 RULE-009。
