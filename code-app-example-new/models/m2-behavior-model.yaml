      - stepId: FUN-018-S02
        name: 新增人员
        actor: 财务人员、财务经理
        description: 点击新增，弹窗录入人员编号、人员名称和所属部门；保存时校验人员编号唯一、所属部门存在，校验通过后保存并立即生效。
      - stepId: FUN-018-S03
        name: 修改人员
        actor: 财务人员、财务经理
