    description: 财务人员或财务经理维护部门基础数据，包括按条件查询、新增、修改和删除；部门编号保存后只读、不可修改，部门编号和部门名称必须唯一，已被合同或人员引用的部门不允许删除。
    preconditions: 已登录且具备基础数据维护权限。
    operationSteps:
      - stepId: FUN-017-S01
        name: 查询部门
        actor: 财务人员、财务经理
        description: 进入部门信息菜单，可按部门编号和部门名称模糊查询，列表分页展示部门编号、部门名称和操作。
      - stepId: FUN-017-S02
        name: 新增部门
        actor: 财务人员、财务经理
        description: 点击新增，弹窗录入部门编号和部门名称；保存时校验部门编号和部门名称唯一，校验通过后保存并立即生效，影响合同所属部门选择和报表统计维度。
      - stepId: FUN-017-S03
        name: 修改部门
        actor: 财务人员、财务经理
        description: 点击行内修改，部门编号只读、不可修改，仅可修改部门名称；保存时校验部门名称唯一。
      - stepId: FUN-017-S04
        name: 删除部门
