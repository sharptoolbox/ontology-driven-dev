        name: 查询产品
        actor: 财务人员、财务经理
        description: 进入产品信息菜单，可按产品编号、产品名称模糊和产品类型筛选，列表分页展示产品编号、产品类型、产品名称和操作。
      - stepId: FUN-015-S02
        name: 新增产品
        actor: 财务人员、财务经理
        description: 点击新增，弹窗录入产品编号、产品类型和产品名称；保存时校验产品编号和产品名称唯一，校验通过后保存并立即生效，合同新增时可选。
      - stepId: FUN-015-S03
        name: 修改产品
        actor: 财务人员、财务经理
        description: 点击行内修改，产品编号只读、不可修改，仅可修改产品类型和产品名称；保存时校验产品名称唯一。
      - stepId: FUN-015-S04
        name: 删除产品
        actor: 财务人员、财务经理、系统
        description: 点击行内删除，系统校验该产品是否被合同引用；未被引用时弹出确认后删除，已引用时提示该产品已被合同引用、不允许删除。
    relatedEntities:
