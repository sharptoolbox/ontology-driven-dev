      - stepId: FUN-018-S04
        name: 删除人员
        actor: 财务人员、财务经理、系统
        description: 点击行内删除，系统校验该人员是否被合同引用为责任人或创建人；未被引用时弹出确认后删除，已引用时提示该人员已被合同引用、不允许删除。
    relatedEntities:
      - MDM-004
      - MDM-003
    relatedRules:
      - RULE-010
  - id: FUN-019
    name: 合同类型及基础字典维护
    behaviorType: MAINTAIN
    ownerEntity: DIC-001
    description: 财务经理维护合同类型、产品类型、客户类型和收款方式字典，包括按分类查询、新增字典项、修改、删除和启停用；合同状态与开票收款状态只读展示、不可维护；字典编码保存后只读、不可修改，字典编码和名称必须唯一，已被业务数据引用的字典项不允许删除但可停用。
    preconditions: 已登录且具备字典维护权限。
    operationSteps:
      - stepId: FUN-019-S01
        name: 选择字典分类
        actor: 财务经理
        description: 进入合同类型菜单，左侧分类树显示合同类型、产品类型、客户类型和收款方式；合同状态与开票收款状态以只读方式展示、不可维护；选择分类后右侧列表展示该分类的字典项编码、名称、排序号和是否启用。
      - stepId: FUN-019-S02
        name: 新增字典项
        actor: 财务经理
        description: 点击新增字典项，录入字典编码、字典项名称、排序号和是否启用；保存时校验同一分类下字典编码和名称唯一，校验通过后保存并立即在合同、产品、客户或收款录入下拉中生效。
      - stepId: FUN-019-S03
        name: 修改字典项
        actor: 财务经理
        description: 点击行内修改，字典编码只读、不可修改，仅可修改字典项名称、排序号和是否启用。
      - stepId: FUN-019-S04
        name: 删除字典项
        actor: 财务经理、系统
        description: 点击删除时，系统校验该字典项是否被合同、产品、客户或收款引用；未被引用时允许删除，已引用时提示该字典项已被业务数据引用、不允许删除，可改为停用。
      - stepId: FUN-019-S05
        name: 启用或停用字典项
        actor: 财务经理
        description: 在列表行内切换是否启用；停用后新业务不可选择该字典项，历史数据不受影响，启用后恢复可选。
    relatedEntities:
      - DIC-001
      - DIC-004
      - DIC-005
