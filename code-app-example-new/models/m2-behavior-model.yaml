  - id: FUN-013
    name: 部门合同统计分析报表
    behaviorType: QUERY
    ownerEntity: OBJ-001
    description: 全部角色按数据权限查询部门合同统计分析报表，按部门和统计时间段汇总合同签订总金额、开票总金额和已开票未收款金额，按部门逐行输出并在末行显示合计行；普通员工与销售人员仅统计本人所属部门。
    preconditions: 已登录；统计时间段必填。
    operationSteps:
      - stepId: FUN-013-S01
        name: 选择统计条件
        actor: 全部角色
        description: 进入部门合同统计菜单，选择部门并可多选，默认按权限展示全部可见部门；选择统计起止时间，必填，默认本月1日至当天；点击重置恢复默认条件。
      - stepId: FUN-013-S02
        name: 按部门汇总统计
        actor: 全部角色、系统
        description: 点击查询后按部门逐行输出统计结果；合同签订总金额统计统计时间段内合同签订时间落在区间内且合同状态为审批中、已生效或已关闭的合同总金额之和，草稿不计入；开票总金额统计统计时间段内开票时间落在区间内且对应合同属于该部门的开票金额之和。
      - stepId: FUN-013-S03
        name: 计算已开票未收款金额
        actor: 系统
        description: 已开票未收款金额统计统计时间段内开票的发票截至统计期末的开票金额减该开票累计已收款金额之和，采用期末余额口径，结果不小于0。
      - stepId: FUN-013-S04
        name: 展示合计行与权限过滤
        actor: 全部角色、系统
        description: 报表按部门编号排序分页展示，展示列包括序号、部门编号、部门名称、合同签订总金额、开票总金额和已开票未收款金额，末行为各列按部门汇总相加的合计行；普通员工和销售人员仅统计本人所属部门，其他角色统计权限范围内全部部门。
    relatedEntities:
      - OBJ-001
      - OBJ-003
      - OBJ-004
      - MDM-003
    relatedRules:
      - RULE-009
  - id: FUN-014
    name: 统计报表导出
    behaviorType: QUERY
    ownerEntity: OBJ-001
    description: 在部门合同统计分析报表完成查询后，按当前查询条件将报表结果导出为Excel文件，导出内容与当前查询结果完全一致，包含合计行，不含下钻明细。建模补充假设：导出文件由系统生成，文件名包含统计时间段。
    preconditions: 已按FUN-013完成一次部门合同统计查询。
    operationSteps:
      - stepId: FUN-014-S01
        name: 发起导出
        actor: 与FUN-013报表查询角色一致
        description: 在部门合同统计页面点击导出，系统弹出确认框显示统计时间段、部门范围和数据行数。
      - stepId: FUN-014-S02
        name: 确认导出
        actor: 与FUN-013报表查询角色一致
        description: 点击确认导出后，系统按当前查询条件生成Excel文件，文件名包含统计时间段，导出内容与当前查询结果完全一致并包含合计行，不含下钻明细。
    relatedEntities:
      - OBJ-001
      - OBJ-003
      - OBJ-004
      - MDM-003
    relatedRules:
      - RULE-009
  - id: FUN-015
    name: 产品信息维护
    behaviorType: MAINTAIN
    ownerEntity: MDM-001
    description: 财务人员或财务经理维护产品基础数据，包括按条件查询、新增、修改和删除；产品编号保存后只读、不可修改，产品编号和产品名称必须唯一，已被合同引用的产品不允许删除。
