        description: 进入合同收款菜单，页面下部显示收款列表，按当前用户数据权限过滤可见收款范围。
      - stepId: FUN-012-S02
        name: 输入收款查询条件
        actor: 财务人员、财务经理、总经理、普通员工
        description: 支持按收款编号模糊、合同编号模糊、开票编号模糊、收款时间起止和收款方式筛选；点击重置清空全部条件。
      - stepId: FUN-012-S03
        name: 展示收款列表
        actor: 财务人员、财务经理、总经理、普通员工、系统
        description: 点击查询后按收款时间倒序分页展示收款记录，展示列包括收款编号、对应合同编号、合同名称、对应开票编号、收款金额、收款时间、收款方式、收款登记人和备注。
    relatedEntities:
