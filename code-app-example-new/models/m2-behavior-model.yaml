        description: 点击行内修改，客户编号只读、不可修改，仅可修改客户类型和客户名称；保存时校验客户名称唯一。
      - stepId: FUN-016-S04
        name: 删除客户
        actor: 财务人员、财务经理、系统
        description: 点击行内删除，系统校验该客户是否被合同引用；未被引用时弹出确认后删除，已引用时提示该客户已被合同引用、不允许删除。
